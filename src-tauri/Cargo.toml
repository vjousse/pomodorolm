[package]
name = "pomodorolm"
version = "0.9.3"
description = "A Tauri App"
authors = ["Vincent Jousse"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [ "devtools", "tray-icon", "image-png"] }
image = { version = "0.25", features = ["png"] }
tempfile = "3.27.0"
toml = "1.1.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3.34"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio-stream = "0.1.19"
hex_color = "3.0.0"
hyper-tls = "0.6.0"
rustls-pemfile = "2.2.0"
rodio = "0.23.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
anyhow = "1.0.104"
[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

[lib]
name = "pomodorolm_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Enable KSNI backend for tray-icon (instead of libappindicator) to handle clicks on Linux
# See https://github.com/vjousse/pomodorolm/issues/170
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

# Backport of two KSNI fixes released in tray-icon 0.26 onto 0.25.1:
# - 3e67801 (#372): wait for a StatusNotifierWatcher that starts after the app
# - fd14a51 (#379): don't own a D-Bus name when running in Flatpak/Snap
# Remove once tauri depends on tray-icon >= 0.26 (see `cargo tree -i tray-icon`).
[patch.crates-io]
tray-icon = { git = "https://github.com/vjousse/tray-icon", branch = "pomodorolm-0.25-backport" }
